name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Offline unit tests (mocked Jev, no API key)
        run: npm test
        env:
          JEV_MOCK: "1"
      - name: Assembly smoke (extension factory registers everything; no LLM needed)
        run: npm run smoke
